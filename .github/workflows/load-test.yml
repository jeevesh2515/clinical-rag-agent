name: Load Test (Staging)

# Auto-runs baseline + burst against staging after every main-branch deploy.
# Operators also trigger via `workflow_dispatch` for ad-hoc verification.
# When triggered by a pull_request, the workflow:
#   1. exports k6 summary JSON
#   2. parses results into docs/LOAD_TEST_RESULTS.md
#   3. auto-commits the patched docs back to the PR branch
#   4. posts a PR comment linking to the run URL

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "Which k6 scenario to run"
        required: true
        type: choice
        default: all
        options:
          - preflight
          - baseline
          - burst
          - all

permissions:
  contents: write           # to push the auto-commit back to the PR branch
  pull-requests: write      # to comment PASS/FAIL on the triggering PR

concurrency:
  group: load-test-${{ github.ref }}
  cancel-in-progress: false   # don't cancel a run mid-burst

jobs:
  load-test:
    name: k6 — ${{ github.event.inputs.scenario || 'all' }}
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # When triggered by a PR we need the PR branch checked out so the
          # auto-commit step pushes back to the same branch.
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Install k6
        run: |
          curl -sSL https://github.com/grafana/k6/releases/download/v0.49.0/k6-v0.49.0-linux-amd64.tar.gz \
            -o /tmp/k6.tar.gz
          tar -xzf /tmp/k6.tar.gz -C /tmp
          sudo mv /tmp/k6-v0.49.0-linux-amd64/k6 /usr/local/bin/k6
          k6 version

      - name: Determine scenario
        id: scenario
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.scenario }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=all" >> "$GITHUB_OUTPUT"
          fi

      - name: Preflight
        if: steps.scenario.outputs.value == 'preflight' || steps.scenario.outputs.value == 'all'
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
          KUBE_CONTEXT: ${{ secrets.KUBE_CONTEXT }}
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
        run: bash ./scripts/preflight_load_test.sh

      - name: Baseline (50 RPS × 10 min)
        if: steps.scenario.outputs.value == 'baseline' || steps.scenario.outputs.value == 'all'
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
          TOKEN: ${{ secrets.STAGING_TOKEN }}
        run: |
          mkdir -p docs/load-test-results
          k6 run \
            --out json=docs/load-test-results/baseline-ci-${{ github.run_id }}.json \
            --summary-export=docs/load-test-results/baseline-summary-${{ github.run_id }}.json \
            tests/load/baseline.js \
            -e BASE_URL="$STAGING_URL" -e TOKEN="$TOKEN"

      - name: Cooldown (5 min)
        if: steps.scenario.outputs.value == 'all'
        run: sleep 300

      - name: Burst (200 RPS × 2 min)
        if: steps.scenario.outputs.value == 'burst' || steps.scenario.outputs.value == 'all'
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
          TOKEN: ${{ secrets.STAGING_TOKEN }}
        run: |
          k6 run \
            --out json=docs/load-test-results/burst-ci-${{ github.run_id }}.json \
            --summary-export=docs/load-test-results/burst-summary-${{ github.run_id }}.json \
            tests/load/burst.js \
            -e BASE_URL="$STAGING_URL" -e TOKEN="$TOKEN"

      - name: Capture metrics
        if: always()
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
          KUBE_CONTEXT: ${{ secrets.KUBE_CONTEXT }}
        run: |
          mkdir -p docs/load-test-results
          bash ./scripts/capture_metrics.sh

      - name: Parse k6 results into docs/LOAD_TEST_RESULTS.md
        if: always()
        run: |
          python3 -c "import scripts.parse_k6_results" 2>/dev/null || true
          python3 scripts/parse_k6_results.py

      - name: Auto-commit results back to PR branch
        if: always() && github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/load-test-results/ docs/LOAD_TEST_RESULTS.md || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "ci: load test results from run ${{ github.run_id }} [skip ci]"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Comment on PR with summary
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          MSG="🚀 **Load test finished.** Workflow run: $RUN_URL\n\n"
          MSG+="Result JSON files are committed back to this PR under docs/load-test-results/. "
          MSG+="See the updated Pass Criteria tables in docs/LOAD_TEST_RESULTS.md."
          gh pr comment ${{ github.event.pull_request.number }} --body "$MSG" || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results-${{ github.run_id }}
          path: docs/load-test-results/
          retention-days: 30

      - name: Summarize
        if: always()
        run: |
          echo "## Load Test Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "Scenario: ${{ steps.scenario.outputs.value }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          ls -la docs/load-test-results/ >> "$GITHUB_STEP_SUMMARY" 2>&1 || true