[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-rag-mcp"
version = "0.1.0"
description = "Model Context Protocol (MCP) server for Clinical Workflows RAG Agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0",
    "httpx>=0.27",
]

[project.scripts]
clinical-rag-mcp = "server:main"

[tool.setuptools]
py-modules = ["server"]
