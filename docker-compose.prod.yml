# Production single-host analogue of the Kubernetes manifests in k8s/.
#
# IMPORTANT — volume layout:
# We bind-mount the host directory `./data` into the container so that:
#   * Bundled clinical guidelines baked into the image at build time
#     (COPY data ./data) remain visible at runtime (the named-volume trap
#     would silently shadow them).
#   * SQLite database, ingestion manifests, and uploads persist across
#     container restarts.
#
# For a multi-host production deployment, replace this compose file with the
# Kubernetes manifests in k8s/ which use a real PersistentVolumeClaim and
# ConfigMap/Secret separation.

services:
  clinical-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clinical-workflow-prod
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Bind-mount so COPY'd data is not shadowed. For multi-host production
      # this file is NOT the right tool — use the k8s/ manifests which
      # provide a real PersistentVolumeClaim + StatefulSet-friendly volume
      # contract.
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - LOG_LEVEL=INFO
      - DATABASE_URL=sqlite:////app/data/clinical_prod.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
