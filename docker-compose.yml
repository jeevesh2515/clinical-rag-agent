# Clinical Workflows — Evidence-Based Care Planning
# Persistent Multi-Container / Standalone Docker Compose Setup

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clinical-workflows-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Default to persistent SQLite on the mounted data volume if DATABASE_URL is not set in .env
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/data/clinical_app.db}
      - APP_ENV=production
      - LOG_LEVEL=INFO
      - VECTOR_STORE=${VECTOR_STORE:-auto}
    volumes:
      # Host bind mount ensuring all databases, chat history, user accounts,
      # uploaded documents, manifests, and vectors persist across restarts and rebuilds:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Optional local PostgreSQL with pgvector (enable if using local Postgres instead of SQLite/Neon)
  # Run with: docker compose --profile postgres up -d
  postgres:
    profiles: ["postgres"]
    image: pgvector/pgvector:pg16
    container_name: clinical-workflows-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: clinical_rag
      POSTGRES_USER: clinical
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "psql -U clinical -d clinical_rag -c \"SELECT extname FROM pg_extension WHERE extname='vector'\" | grep -q vector"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local

