apiVersion: apps/v1
kind: Deployment
metadata:
  name: clinical-workflow-rag
  namespace: default
  labels:
    app.kubernetes.io/name: clinical-workflow-rag
    app.kubernetes.io/component: backend-api
    app.kubernetes.io/part-of: clinical-workflows
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: clinical-workflow-rag
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clinical-workflow-rag
        app.kubernetes.io/component: backend-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: clinical-rag-app
          image: ghcr.io/jeevesh2515/clinical-rag-agent:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: clinical-app-config
            - secretRef:
                name: clinical-app-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1536Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
