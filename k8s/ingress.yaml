apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: clinical-workflow-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - api.clinical-workflows.org
      secretName: clinical-workflows-tls
  rules:
    - host: api.clinical-workflows.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: clinical-workflow-service
                port:
                  number: 80
