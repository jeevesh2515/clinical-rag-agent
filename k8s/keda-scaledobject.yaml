# Day 26 — KEDA ScaledObject.
# Reads the http_requests_in_flight Prometheus gauge and scales the
# clinical-workflow-rag deployment 2-10 replicas with a 5-minute cooldown.
# This is ADDITIVE to the existing CPU HPA — the CPU HPA stays as a
# safety net in case the Prometheus query is briefly unavailable.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: clinical-rag-scaler
  namespace: default
  labels:
    app.kubernetes.io/name: clinical-workflow-rag
    app.kubernetes.io/part-of: clinical-workflows
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: clinical-workflow-rag
  pollingInterval: 30       # seconds between KEDA->Prometheus queries
  cooldownPeriod: 300       # 5 min before scaling down
  minReplicaCount: 2
  maxReplicaCount: 10
  fallback:
    failureThreshold: 3
    replicas: 2             # When Prometheus is unavailable, fall back to 2 replicas
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Percent
              value: 50
              periodSeconds: 60
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Percent
              value: 100
              periodSeconds: 30
  triggers:
    - type: prometheus
      metadata:
        # Address of the kube-prometheus-stack Prometheus server.
        serverAddress: http://kube-prometheus-stack-prometheus.monitoring.svc:9090
        # Custom-metrics name KEDA registers with the HPA API.
        metricName: clinical_rag_http_requests_in_flight
        # Prometheus query: total in-flight HTTP requests across all pods.
        query: |
          sum(http_requests_in_flight{namespace="default", endpoint=~"/api/query|/api/query/stream"})
        threshold: "10"
        activationThreshold: "0"
