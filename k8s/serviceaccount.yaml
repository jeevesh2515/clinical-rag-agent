# Dedicated ServiceAccount for the Clinical Workflows deployment.
#
# Using a dedicated SA (instead of the `default` service account) means we
# can grant scoped RBAC later (CloudWatch metrics, S3 reads, IRSA for AWS)
# without affecting unrelated workloads sharing the namespace.
#
# automountServiceAccountToken: false — the app does not call the K8s API.
# Enable and configure RBAC only when a workload-identity feature is added.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: clinical-rag-app
  namespace: default
  labels:
    app.kubernetes.io/name: clinical-workflow-rag
    app.kubernetes.io/component: backend-api
    app.kubernetes.io/part-of: clinical-workflows
automountServiceAccountToken: false
